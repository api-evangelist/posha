name: Posha
description: 'Posha (formerly Nymble) is a consumer robotics company that makes an autonomous
  countertop kitchen robot which cooks fresh, home-style meals from raw ingredients across
  1,000+ recipes. The device combines robotics, computer-vision cameras, automated heat,
  timing and stirring control, and culinary AI, paired with an iOS/Android companion app
  for real-time monitoring and recipe control. Backed by Accel, Posha is a consumer hardware
  and appliance product with a companion mobile app; it does not publish a public developer
  API, SDK, or webhook surface. Added to the API Evangelist network as a portfolio-company
  lead and enriched with real, verifiable public properties.'
